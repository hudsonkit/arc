name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string
      package:
        description: 'Package scope'
        required: false
        type: choice
        options:
          - all
          - arc
        default: all
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library
        run: bun run build:lib

      - name: Build viewer
        if: github.event_name != 'workflow_dispatch' || inputs.package != 'arc'
        run: bun run --filter '@arach/arc-viewer' build

      - name: Build isometric
        if: github.event_name != 'workflow_dispatch' || inputs.package != 'arc'
        run: |
          bun run build:iso
          mkdir -p packages/iso/dist
          cp dist-iso/*.js packages/iso/dist/
          cp dist-iso/*.d.ts packages/iso/dist/ 2>/dev/null || true

      - name: Build MCP server
        if: github.event_name != 'workflow_dispatch' || inputs.package != 'arc'
        run: bun run --filter '@arach/arc-mcp' build

      - name: Publish helper
        # A release re-run must be able to finish what an earlier run started:
        # publishing a version npm already has is an error, so skip it.
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'SH'
          publish() {
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping"
            else
              npm publish --provenance --access public "$@"
            fi
          }
          SH

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set version (from tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ${{ steps.tag_version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Set version (manual)
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Publish @arach/arc (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          . "$RUNNER_TEMP/publish.sh"
          publish

      - name: Publish @arach/arc-viewer (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/viewer
        run: |
          npm version ${{ steps.tag_version.outputs.VERSION }} --no-git-tag-version --allow-same-version --workspaces=false
          . "$RUNNER_TEMP/publish.sh"
          publish --workspaces=false

      - name: Publish @arach/arc-iso (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/iso
        run: |
          npm version ${{ steps.tag_version.outputs.VERSION }} --no-git-tag-version --allow-same-version --workspaces=false
          . "$RUNNER_TEMP/publish.sh"
          publish --workspaces=false

      - name: Publish @arach/arc-mcp (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/mcp
        run: |
          npm version ${{ steps.tag_version.outputs.VERSION }} --no-git-tag-version --allow-same-version --workspaces=false
          . "$RUNNER_TEMP/publish.sh"
          publish --workspaces=false

      - name: Publish @arach/arc (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would publish @arach/arc"
            bun run check:dist
            npm pack --dry-run --ignore-scripts
          else
            . "$RUNNER_TEMP/publish.sh"
            publish
          fi

      - name: Publish @arach/arc-viewer (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.package != 'arc'
        working-directory: packages/viewer
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version --workspaces=false
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would publish @arach/arc-viewer"
            npm pack --dry-run --ignore-scripts --workspaces=false
          else
            . "$RUNNER_TEMP/publish.sh"
            publish --workspaces=false
          fi

      - name: Publish @arach/arc-iso (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.package != 'arc'
        working-directory: packages/iso
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version --workspaces=false
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would publish @arach/arc-iso"
            npm pack --dry-run --ignore-scripts --workspaces=false
          else
            . "$RUNNER_TEMP/publish.sh"
            publish --workspaces=false
          fi

      - name: Publish @arach/arc-mcp (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.package != 'arc'
        working-directory: packages/mcp
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version --workspaces=false
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would publish @arach/arc-mcp"
            npm pack --dry-run --ignore-scripts --workspaces=false
          else
            . "$RUNNER_TEMP/publish.sh"
            publish --workspaces=false
          fi
