name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string
      package:
        description: 'Package scope'
        required: false
        type: choice
        options:
          - all
          - arc
          - mcp
        default: all
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set release versions before building
        env:
          RELEASE_INPUT: ${{ inputs.version }}
          PACKAGE_SCOPE: ${{ inputs.package || 'all' }}
        run: |
          version="$RELEASE_INPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          node scripts/set-release-version.mjs "$version" "$PACKAGE_SCOPE"

      - name: Verify source
        run: |
          bun test
          bun run typecheck
          bun run lint

      - name: Build library and CLI
        if: inputs.package != 'mcp'
        run: |
          bun run build:lib
          bun run build:cli
          bun run check:dist

      - name: Build viewer
        if: inputs.package != 'arc' && inputs.package != 'mcp'
        run: bun run --filter '@hudsonkit/arc-viewer' build

      - name: Build isometric
        if: inputs.package != 'arc' && inputs.package != 'mcp'
        run: |
          bun run build:iso
          mkdir -p packages/iso/dist
          cp dist-iso/*.js dist-iso/*.cjs dist-iso/*.d.ts dist-iso/*.d.cts packages/iso/dist/

      - name: Build MCP server
        if: inputs.package != 'arc'
        run: bun run build:mcp

      - name: Verify viewer and isometric packages
        if: inputs.package != 'arc' && inputs.package != 'mcp'
        run: |
          for package in viewer iso; do
            bunx attw --pack "packages/$package"
            bunx publint "packages/$package"
            node scripts/check-package-runtime.mjs "packages/$package"
          done

      - name: Verify MCP package
        if: inputs.package != 'arc'
        run: node scripts/check-package-runtime.mjs packages/mcp

      - name: Install cosign
        if: inputs.package != 'arc'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install verified MCP publisher
        if: inputs.package != 'arc'
        env:
          MCP_PUBLISHER_VERSION: v1.8.4
          MCP_PUBLISHER_REPOSITORY: https://github.com/modelcontextprotocol/registry
        run: |
          publisher_dir="$RUNNER_TEMP/mcp-publisher"
          mkdir -p "$publisher_dir"
          archive="$publisher_dir/mcp-publisher_linux_amd64.tar.gz"
          release_url="$MCP_PUBLISHER_REPOSITORY/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error "$release_url/$(basename "$archive")" --output "$archive"
          curl --fail --location --silent --show-error "$release_url/$(basename "$archive").sigstore.json" --output "$archive.sigstore.json"
          cosign verify-blob "$archive" \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "$MCP_PUBLISHER_REPOSITORY/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar -xzf "$archive" -C "$publisher_dir" mcp-publisher
          echo "$publisher_dir" >> "$GITHUB_PATH"

      - name: Validate MCP Registry manifest
        if: inputs.package != 'arc'
        run: mcp-publisher validate packages/mcp/server.json

      - name: Pack or publish release packages
        env:
          PACKAGE_SCOPE: ${{ inputs.package || 'all' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          publish() {
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if [ "$DRY_RUN" = "true" ]; then
              npm pack --dry-run --ignore-scripts --workspaces=false
            elif npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping"
            else
              npm publish --provenance --access public --workspaces=false
            fi
          }
          if [ "$PACKAGE_SCOPE" = "mcp" ]; then
            (cd packages/mcp && publish)
          else
            publish
          fi
          if [ "$PACKAGE_SCOPE" = "all" ]; then
            for package in viewer iso mcp; do
              (cd "packages/$package" && publish)
            done
          fi

      - name: Publish to MCP Registry
        if: inputs.package != 'arc' && !inputs.dry_run
        working-directory: packages/mcp
        env:
          MCP_REGISTRY_URL: https://registry.modelcontextprotocol.io
        run: |
          version_url=$(node --input-type=module <<'NODE'
            import { readFileSync } from "node:fs";
            const server = JSON.parse(readFileSync("server.json", "utf8"));
            console.log(new URL(`/v0.1/servers/${encodeURIComponent(server.name)}/versions/${encodeURIComponent(server.version)}`, process.env.MCP_REGISTRY_URL).href);
          NODE
          )
          status=$(curl --silent --show-error --retry 3 --output "$RUNNER_TEMP/mcp-registry-version.json" --write-out '%{http_code}' "$version_url")
          case "$status" in
            200) echo 'This server version is already in the MCP Registry; skipping' ;;
            404)
              mcp-publisher login github-oidc --registry "$MCP_REGISTRY_URL"
              npm_name=$(node -p "require('./package.json').name")
              npm_version=$(node -p "require('./package.json').version")
              propagation_error="NPM package '$npm_name' exists, but version '$npm_version' was not found (status: 404). A newly published release can take a moment to appear on the registry."
              publish_log="$RUNNER_TEMP/mcp-publish.log"
              # npm's version metadata can lag a successful publish. Retry only that diagnostic.
              for attempt in $(seq 1 12); do
                if mcp-publisher publish server.json > "$publish_log" 2>&1; then
                  cat "$publish_log"
                  break
                else
                  publish_status=$?
                  cat "$publish_log"
                fi
                if [ "$attempt" -eq 12 ] || \
                  ! grep -Fq 'server returned status 400:' "$publish_log" || \
                  ! grep -Fq "$propagation_error" "$publish_log"; then
                  exit "$publish_status"
                fi
                echo "MCP publish attempt $attempt/12 reached npm before the version was available; retrying in 15 seconds"
                sleep 15
              done
              ;;
            *)
              echo "MCP Registry lookup failed with HTTP $status"
              cat "$RUNNER_TEMP/mcp-registry-version.json"
              exit 1
              ;;
          esac
