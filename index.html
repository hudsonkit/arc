    <!-- HudsonKit theme bootstrap — sets data-hudson-theme before first paint. -->
    <script>
      !(function (k, t, p) {
        try {
          var d = document.documentElement,
            q = new URLSearchParams(location.search),
            s = JSON.parse(localStorage.getItem(k) || "{}"),
            x = q.get("theme") || s.theme || t,
            y = q.get("template") || s.template || p,
            m =
              "system" === x &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "system" === x
                  ? "light"
                  : x;
          d.dataset.hudsonTheme = m;
          d.dataset.hudsonTemplate = y;
        } catch (e) {
          var d = document.documentElement,
            m =
              "system" === t &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "system" === t
                  ? "light"
                  : t;
          d.dataset.hudsonTheme = m;
          d.dataset.hudsonTemplate = p;
        }
      })("hudson.theme", "light", "hudson");
    </script>

    <!-- Handle GitHub Pages SPA redirect -->
    <script type="text/javascript">
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the browser's history
      // using window.history.replaceState.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
